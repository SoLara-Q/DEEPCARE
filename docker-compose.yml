services:
  mysql:
    image: mysql:8.0
    container_name: deepcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: deepcare
      MYSQL_USER: deepcare
      MYSQL_PASSWORD: deepcare123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - deepcare-mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  deepcare-mysql-data:
